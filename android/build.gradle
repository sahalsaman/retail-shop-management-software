// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '1.8.22'
            }
        }
    }
}

subprojects {
    afterEvaluate {
        tasks.matching { task ->
            task.name.startsWith("extract") && task.name.endsWith("Annotations")
        }.configureEach {
            enabled = false
        }
        tasks.matching { task ->
            task.name == "syncDebugLibJars"
        }.configureEach {
            def typedefs = file("${buildDir}/intermediates/annotations_typedef_file/debug/extractDebugAnnotations/typedefs.txt")
            typedefs.parentFile.mkdirs()
            if (!typedefs.exists()) {
                typedefs.text = ""
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
